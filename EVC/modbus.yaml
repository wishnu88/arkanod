- type: rtuovertcp
  host: 192.168.85.131
  port: 8899
  name: mb_kat_tis
  timeout_seconds: 5
  wait_milliseconds: 50
  register_group:
  - group_id: 1
    slave: 1
    address: 0
    count: 68
    type: holding
  - group_id: 2
    slave: 1
    address: 1001
    count: 48
    type: holding
  - group_id: 3
    slave: 1
    address: 5001
    count: 48
    type: holding
  - group_id: 4
    slave: 1
    address: 7001
    count: 48
    type: holding
  current_log:
    scan_interval_ms: 30000
    evc_time_regname: EVCTime
    # debug: true
    group_ids:
    - 1
  hourly_log:
    max_retention: 108
    group_ids:
    - 2
  daily_log:
    max_retention: 30
    group_ids:
    - 3
  monthly_log:
    max_retention: 12
    group_ids:
    - 4
  register_conversion:
  - name: EVCTime
    group_ids:
    - 1
    registers: [0, 2]
    data_type: dt2
    swap: none
  - name: Vb
    group_ids:
    - 1
    registers: [3, 6]
    data_type: float64
    swap: word_byte
  - name: Vm
    group_ids:
    - 1
    registers: [7, 10]
    data_type: float64
    swap: word_byte
  - name: E
    group_ids:
    - 1
    registers: [11, 14]
    data_type: float64
    swap: word_byte
    # precision: 3
  - name: Vbs
    group_ids:
    - 1
    registers: [15, 18]
    data_type: float64
    swap: word_byte
    # precision: 3
  - name: Vs
    group_ids:
    - 1
    registers: [19, 22]
    data_type: float64
    swap: word_byte
    # precision: 3
  - name: Es
    group_ids:
    - 1
    registers: [23, 26]
    data_type: float64
    swap: word_byte
    # precision: 3
  - name: Vbdh
    group_ids:
    - 1
    registers: [27, 28]
    data_type: float32
    swap: word_byte
    # precision: 3
  - name: Vbdd
